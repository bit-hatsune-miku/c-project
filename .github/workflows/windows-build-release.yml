name: Windows Build And Package

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  MAIN_TARGET: OurUndergroundBITIdol
  SUPPORT_TARGET: battle_testing
  PACKAGE_PREFIX: HatsuneMiku_windows_amd64_source_bundle

jobs:
  build-package-release:
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-ntldd

      - name: Compute release metadata
        shell: bash
        run: |
          set -euo pipefail

          branch_name="${GITHUB_REF_NAME}"
          safe_branch="$(printf '%s' "$branch_name" | tr '/ ' '--' | tr -cd '[:alnum:]._-' )"
          short_sha="$(git rev-parse --short=8 HEAD)"
          version="0.0.${GITHUB_RUN_NUMBER}-${short_sha}"
          tag_prefix="windows-${safe_branch}-v0.0."
          release_tag="windows-${safe_branch}-v${version}"
          package_name="${PACKAGE_PREFIX}_${version}.zip"
          previous_tag="$(git tag --list "${tag_prefix}*" --sort=-creatordate | head -n 1 || true)"

          {
            echo "SAFE_BRANCH=$safe_branch"
            echo "TAG_PREFIX=$tag_prefix"
            echo "PREVIOUS_TAG=$previous_tag"
            echo "RELEASE_TAG=$release_tag"
            echo "SHORT_SHA=$short_sha"
            echo "VERSION=$version"
            echo "PACKAGE_NAME=$package_name"
          } >> "$GITHUB_ENV"

          if [[ -n "$previous_tag" ]]; then
            git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' > changelog.txt
          else
            git log -n 50 --pretty=format:'- %s (%h)' > changelog.txt
          fi

          if [[ ! -s changelog.txt ]]; then
            echo "- No changes since the previous Windows build." > changelog.txt
          fi

          {
            echo "## Windows package"
            echo
            echo "- Branch: \`${branch_name}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${version}\`"
            echo "- Run: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Artifact: \`${package_name}\`"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "- Changelog source: commits since \`${previous_tag}\`"
              echo "- Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_SHA}"
            else
              echo "- Changelog source: latest 50 commits on first recorded Windows build for this branch"
            fi
            echo
            echo "### Changes"
            cat changelog.txt
          } > release_notes.md

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"

      - name: Build executables
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config "${BUILD_TYPE}" --target "${MAIN_TARGET}" "${SUPPORT_TARGET}"

      - name: Stage package contents
        shell: msys2 {0}
        run: |
          set -euo pipefail

          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          stage_dir="$workspace/dist/staging"
          generated_dll_manifest="$workspace/dist/generated-build-dlls.txt"
          runtime_prefix="${MINGW_PREFIX:-/ucrt64}"
          runtime_dir="${runtime_prefix}/bin"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          mkdir -p "$workspace/dist"
          : > "$generated_dll_manifest"

          git archive --format=tar HEAD | tar -xf - -C "$stage_dir"

          cp "build/bin/${MAIN_TARGET}.exe" "$stage_dir/"
          cp "build/bin/${SUPPORT_TARGET}.exe" "$stage_dir/"

          while IFS= read -r -d '' built_dll; do
            dll_name="$(basename "$built_dll")"
            cp -f "$built_dll" "$stage_dir/$dll_name"
            printf '%s\n' "$dll_name" >> "$generated_dll_manifest"
          done < <(find build -maxdepth 4 -type f -name '*.dll' -print0)

          copy_runtime_dll() {
            local dll_name="$1"
            if [[ ! -f "${runtime_dir}/${dll_name}" ]]; then
              echo "Missing runtime DLL in MSYS2 environment: ${dll_name}" >&2
              exit 1
            fi
            cp -f "${runtime_dir}/${dll_name}" "$stage_dir/"
          }

          for dll_name in \
            SDL2.dll \
            SDL2_image.dll \
            SDL2_ttf.dll \
            libgcc_s_seh-1.dll \
            libstdc++-6.dll \
            libwinpthread-1.dll
          do
            copy_runtime_dll "$dll_name"
          done

          find "$runtime_dir" -maxdepth 1 -type f -name '*.dll' -exec cp -f {} "$stage_dir/" \;

          cat > "$stage_dir/BUILD_INFO.txt" <<EOF
          Project: ${MAIN_TARGET}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Short commit: ${SHORT_SHA}
          Run number: ${GITHUB_RUN_NUMBER}
          Runner: blacksmith-4vcpu-windows-2025
          Build type: ${BUILD_TYPE}
          Included executables:
            - ${MAIN_TARGET}.exe
            - ${SUPPORT_TARGET}.exe
          EOF

      - name: Verify staged runtime dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail

          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          stage_dir="$workspace/dist/staging"
          generated_dll_manifest="$workspace/dist/generated-build-dlls.txt"

          for required_file in \
            "${MAIN_TARGET}.exe" \
            "${SUPPORT_TARGET}.exe" \
            "SDL2.dll" \
            "SDL2_image.dll" \
            "SDL2_ttf.dll" \
            "libgcc_s_seh-1.dll" \
            "libstdc++-6.dll" \
            "libwinpthread-1.dll"
          do
            if [[ ! -f "${stage_dir}/${required_file}" ]]; then
              echo "Packaged file missing: ${required_file}" >&2
              exit 1
            fi
          done

          if [[ -f "$generated_dll_manifest" ]]; then
            while read -r dll_name; do
              [[ -n "$dll_name" ]] || continue
              if [[ ! -f "${stage_dir}/${dll_name}" ]]; then
                echo "Build-produced DLL missing from package: ${dll_name}" >&2
                exit 1
              fi
            done < "$generated_dll_manifest"
          fi

          for exe_name in "${MAIN_TARGET}.exe" "${SUPPORT_TARGET}.exe"; do
            ntldd -R "${stage_dir}/${exe_name}" > "$workspace/dist/${exe_name}.deps.txt" || true
          done

      - name: Smoke test packaged executable launch
        continue-on-error: true
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "dist\staging"
          $exePath = Join-Path $stageDir "$env:MAIN_TARGET.exe"

          $env:SDL_AUDIODRIVER = "dummy"
          $env:SDL_VIDEODRIVER = "dummy"
          $process = Start-Process -FilePath $exePath -WorkingDirectory $stageDir -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) {
              Write-Host "Dependency snapshot for packaged executable:"
              & "$env:RUNNER_TEMP\msys64\ucrt64\bin\ntldd.exe" -R $exePath | Out-Host
              Write-Host "Packaged executable exited immediately with code $($process.ExitCode)."
              exit 1
            }
          } else {
            Stop-Process -Id $process.Id -Force
          }

      - name: Create zip archive
        shell: pwsh
        run: |
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $zipPath = Join-Path $distDir $env:PACKAGE_NAME
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $distDir "staging\*") -DestinationPath $zipPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ env.SAFE_BRANCH }}-${{ env.SHORT_SHA }}
          path: dist/${{ env.PACKAGE_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Windows ${{ env.VERSION }} - ${{ github.ref_name }}
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
          files: dist/${{ env.PACKAGE_NAME }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          fail_on_unmatched_files: true
