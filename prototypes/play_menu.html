<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play Menu Prototype</title>
  <style>
    @font-face {
      font-family: "Space Mono";
      src: url("../assets/fonts/SpaceMono-Regular.ttf") format("truetype");
      font-weight: 400;
    }

    @font-face {
      font-family: "Space Mono";
      src: url("../assets/fonts/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    :root {
      --ink: #17141f;
      --ink-soft: rgba(23, 20, 31, 0.48);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-line: rgba(23, 20, 31, 0.18);
      --pink: #ff63b0;
      --pink-shadow: rgba(255, 99, 176, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 46%, rgba(255, 99, 176, 0.08), transparent 24%),
        linear-gradient(180deg, #ffffff 0%, #fff8fc 100%);
      color: var(--ink);
      font-family: "Space Mono", monospace;
    }

    body {
      position: relative;
      min-height: 100vh;
    }

    .screen {
      --disc-drift-x: 0px;
      --disc-drift-y: 0px;
      --ui-drift-x: 0px;
      --ui-drift-y: 0px;
      --logo-drift-x: 0px;
      --logo-drift-y: 0px;
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .disc-layer,
    .logo-layer,
    .foreground-layer,
    .bars-layer {
      position: absolute;
      inset: 0;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .disc-layer {
      transform: translate(var(--disc-drift-x), var(--disc-drift-y));
      z-index: 0;
    }

    .bars-layer {
      z-index: 1;
      pointer-events: none;
    }

    .logo-layer {
      transform: translate(var(--logo-drift-x), var(--logo-drift-y));
      z-index: 2;
      pointer-events: none;
    }

    .foreground-layer {
      transform: translate(var(--ui-drift-x), var(--ui-drift-y));
      z-index: 3;
    }

    .disc {
      position: absolute;
      top: 50%;
      right: clamp(-12rem, -5vw, -3rem);
      width: min(72vw, 70rem);
      aspect-ratio: 1;
      transform: translateY(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 99, 176, 0.06) 0 7%, transparent 7.2% 100%),
        radial-gradient(circle at center, transparent 0 20%, rgba(23, 20, 31, 0.045) 20.2% 20.5%, transparent 20.6% 31%, rgba(23, 20, 31, 0.035) 31.2% 31.45%, transparent 31.6% 42%, rgba(23, 20, 31, 0.028) 42.2% 42.45%, transparent 42.6% 53%, rgba(255, 99, 176, 0.05) 53.2% 53.45%, transparent 53.6% 64%, rgba(23, 20, 31, 0.022) 64.2% 64.45%, transparent 64.6% 100%);
      border: 1px solid rgba(23, 20, 31, 0.1);
      box-shadow:
        0 1.2rem 4rem rgba(23, 20, 31, 0.05),
        inset 0 0 0 5rem rgba(255, 255, 255, 0.24);
    }

    .disc::before,
    .disc::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(23, 20, 31, 0.08);
    }

    .disc::after {
      inset: 24%;
      border-color: rgba(255, 99, 176, 0.16);
    }

    .disc-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7rem;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 99, 176, 0.12);
      border: 1px solid rgba(255, 99, 176, 0.35);
    }

    .disc-core::after {
      content: "";
      position: absolute;
      inset: 36%;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(23, 20, 31, 0.22);
    }

    .logo {
      position: absolute;
      top: clamp(2rem, 4vh, 3rem);
      left: 50%;
      width: min(33rem, 42vw);
      transform: translateX(-50%);
      object-fit: contain;
      filter: contrast(1.04);
    }

    .menu-frame {
      position: absolute;
      top: 50%;
      left: clamp(3rem, 7vw, 7rem);
      width: min(42rem, 52vw);
      transform: translateY(-40%);
    }

    .eyebrow {
      margin: 0 0 1rem 0.8rem;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.34rem;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .menu {
      position: relative;
      display: grid;
      gap: 1rem;
    }

    .menu-item {
      --indent: 0rem;
      --scale: 1;
      --fg: var(--ink);
      --bg-local: var(--panel);
      --line-local: var(--panel-line);
      --shadow-local: transparent;
      --accent-opacity: 0.15;
      --glow-opacity: 0;
      position: relative;
      width: min(35rem, calc(100% - 1rem));
      height: clamp(3.5rem, 8vh, 4.6rem);
      margin-left: var(--indent);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transform-origin: left center;
      transform: scale(var(--scale));
      transition:
        transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
        margin-left 260ms cubic-bezier(0.22, 1, 0.36, 1),
        filter 260ms ease;
      outline: none;
      text-align: left;
    }

    .menu-item::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 1.3rem;
      background: var(--bg-local);
      border: 1px solid var(--line-local);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.32) inset,
        0 1.2rem 2.5rem var(--shadow-local);
      transform: skewX(-18deg);
      transition:
        background-color 260ms ease,
        border-color 260ms ease,
        box-shadow 260ms ease;
    }

    .menu-item:focus-visible {
      filter: brightness(1.03);
    }

    .menu-item-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 1.15rem;
      padding: 0 1.65rem 0 2rem;
      transform: skewX(-18deg);
    }

    .menu-item-inner > * {
      transform: skewX(18deg);
    }

    .menu-accent {
      flex: 0 0 auto;
      width: 0.7rem;
      height: 2.2rem;
      border-radius: 999px;
      background: rgba(23, 20, 31, var(--accent-opacity));
      transition: background-color 260ms ease;
    }

    .menu-index {
      flex: 0 0 auto;
      min-width: 2rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22rem;
      color: rgba(23, 20, 31, 0.58);
      transition: color 260ms ease;
    }

    .menu-label {
      flex: 1 1 auto;
      font-size: clamp(1.15rem, 1vw + 0.9rem, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
      color: var(--fg);
      transition:
        color 260ms ease,
        font-size 260ms ease,
        letter-spacing 260ms ease;
    }

    .menu-glow {
      flex: 0 0 auto;
      width: 5.5rem;
      height: 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0);
      background: rgba(255, 255, 255, 0.18);
      opacity: var(--glow-opacity);
      transition:
        opacity 260ms ease,
        border-color 260ms ease,
        background-color 260ms ease;
    }

    .menu-item.is-selected {
      --scale: 1.085;
      --fg: #ffffff;
      --bg-local: var(--pink);
      --line-local: rgba(255, 99, 176, 0.9);
      --shadow-local: var(--pink-shadow);
      --accent-opacity: 0.72;
      --glow-opacity: 1;
      z-index: 3;
    }

    .menu-item.is-selected .menu-index {
      color: rgba(255, 255, 255, 0.86);
    }

    .menu-item.is-selected .menu-label {
      font-size: clamp(1.25rem, 1.1vw + 1rem, 1.86rem);
      letter-spacing: 0.12rem;
    }

    .status {
      margin-top: 2.4rem;
      margin-left: 0.9rem;
      max-width: 30rem;
    }

    .status-code {
      margin: 0 0 0.6rem 0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.28rem;
      color: rgba(255, 99, 176, 0.9);
      text-transform: uppercase;
    }

    .status-title {
      margin: 0 0 0.75rem 0;
      font-size: clamp(1rem, 0.7vw + 0.9rem, 1.22rem);
      font-weight: 700;
      letter-spacing: 0.06rem;
      text-transform: uppercase;
    }

    .status-copy {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.7;
      color: rgba(23, 20, 31, 0.64);
    }

    .bars-shell {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6.4rem;
      overflow: hidden;
    }

    .bars {
      position: absolute;
      left: clamp(0.8rem, 2vw, 1.8rem);
      right: clamp(0.8rem, 2vw, 1.8rem);
      bottom: 0.7rem;
      height: 4.7rem;
      display: flex;
      align-items: flex-end;
      gap: clamp(0.18rem, 0.55vw, 0.5rem);
    }

    .bar {
      --base-height: 2rem;
      --dur: 1.3s;
      --delay: 0s;
      flex: 1 1 0;
      min-width: 0.45rem;
      max-width: 1.9rem;
      height: var(--base-height);
      border: 1px solid rgba(255, 99, 176, 0.34);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 159, 212, 0.22), rgba(255, 99, 176, 0.14));
      box-shadow: 0 0 1rem rgba(255, 99, 176, 0.12);
      transform-origin: center bottom;
      animation: bar-wave var(--dur) ease-in-out infinite alternate;
      animation-delay: var(--delay);
      opacity: 0.72;
    }

    @keyframes bar-wave {
      from {
        transform: scaleY(0.32);
        opacity: 0.26;
      }
      to {
        transform: scaleY(1);
        opacity: 0.9;
      }
    }

    .hint {
      position: absolute;
      right: clamp(1.4rem, 4vw, 3rem);
      bottom: clamp(4.9rem, 8vh, 5.8rem);
      font-size: 0.72rem;
      letter-spacing: 0.26rem;
      text-transform: uppercase;
      color: rgba(23, 20, 31, 0.4);
      z-index: 4;
    }

    @media (max-width: 900px) {
      .logo {
        width: min(21rem, 76vw);
      }

      .disc {
        top: auto;
        bottom: -18rem;
        right: 50%;
        width: min(120vw, 48rem);
        transform: translateX(50%);
      }

      .menu-frame {
        top: auto;
        bottom: 6.3rem;
        left: 1.1rem;
        width: calc(100% - 2.2rem);
        transform: none;
      }

      .menu-item {
        width: min(100%, 32rem);
      }

      .menu-item[data-curve="0"],
      .menu-item[data-curve="4"] {
        --indent: 0rem !important;
      }

      .menu-item[data-curve="1"],
      .menu-item[data-curve="3"] {
        --indent: 1rem !important;
      }

      .menu-item[data-curve="2"] {
        --indent: 1.8rem !important;
      }

      .status {
        max-width: min(32rem, 92vw);
      }

      .bars-shell {
        height: 5.1rem;
      }

      .bars {
        height: 3.7rem;
        bottom: 0.55rem;
      }

      .hint {
        bottom: 4rem;
      }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen">
    <div class="disc-layer" id="disc-layer">
      <div class="disc" aria-hidden="true">
        <div class="disc-core"></div>
      </div>
    </div>

    <div class="logo-layer" id="logo-layer">
      <img class="logo" src="../assets/vn/backgrounds/General_Art/MainMenuTitle.png" alt="Game logo">
    </div>

    <div class="foreground-layer" id="ui-layer">
      <section class="menu-frame" aria-label="Play menu">
        <p class="eyebrow">Main Menu</p>

        <div class="menu" id="menu">
          <button class="menu-item is-selected" data-index="0" data-curve="0" type="button">
            <span class="menu-item-inner">
              <span class="menu-accent" aria-hidden="true"></span>
              <span class="menu-index">01</span>
              <span class="menu-label">Play</span>
              <span class="menu-glow" aria-hidden="true"></span>
            </span>
          </button>

          <button class="menu-item" data-index="1" data-curve="1" type="button">
            <span class="menu-item-inner">
              <span class="menu-accent" aria-hidden="true"></span>
              <span class="menu-index">02</span>
              <span class="menu-label">Load</span>
              <span class="menu-glow" aria-hidden="true"></span>
            </span>
          </button>

          <button class="menu-item" data-index="2" data-curve="2" type="button">
            <span class="menu-item-inner">
              <span class="menu-accent" aria-hidden="true"></span>
              <span class="menu-index">03</span>
              <span class="menu-label">Battle Selector</span>
              <span class="menu-glow" aria-hidden="true"></span>
            </span>
          </button>

          <button class="menu-item" data-index="3" data-curve="3" type="button">
            <span class="menu-item-inner">
              <span class="menu-accent" aria-hidden="true"></span>
              <span class="menu-index">04</span>
              <span class="menu-label">Settings</span>
              <span class="menu-glow" aria-hidden="true"></span>
            </span>
          </button>

          <button class="menu-item" data-index="4" data-curve="4" type="button">
            <span class="menu-item-inner">
              <span class="menu-accent" aria-hidden="true"></span>
              <span class="menu-index">05</span>
              <span class="menu-label">Quit</span>
              <span class="menu-glow" aria-hidden="true"></span>
            </span>
          </button>
        </div>

        <div class="status" aria-live="polite">
          <p class="status-code" id="status-code">01</p>
          <h2 class="status-title" id="status-title">Enter the opening signal</h2>
          <p class="status-copy" id="status-copy">Start from the first scene and treat this page as a pure browser prototype for layout, motion, and spacing decisions.</p>
        </div>
      </section>
    </div>

    <div class="bars-layer" id="bars-layer" aria-hidden="true">
      <div class="bars-shell">
        <div class="bars" id="bars"></div>
      </div>
    </div>

    <p class="hint">Up / Down or Left / Right to loop. Hold to keep scrolling.</p>
  </main>

  <script>
    const entries = [
      {
        code: "01",
        title: "Enter the opening signal",
        copy: "Start from the first scene and treat this page as a pure browser prototype for layout, motion, and spacing decisions."
      },
      {
        code: "02",
        title: "Resume a saved thread",
        copy: "Jump back into a previous run and check how the menu hierarchy reads when you move away from the highlighted action."
      },
      {
        code: "03",
        title: "Open the battle selector",
        copy: "Use the widest center card to sell the vinyl silhouette, then decide later whether the in-game version needs the same proportions."
      },
      {
        code: "04",
        title: "Tune the system",
        copy: "A settings row should still feel like part of the same track, just slightly narrower as the stack curves back inward."
      },
      {
        code: "05",
        title: "Cut the signal",
        copy: "Looping from the bottom back to the top keeps the interaction fluid and lets us judge the easing rhythm during long key holds."
      }
    ];

    const indentMap = ["0rem", "1.6rem", "3.2rem", "1.6rem", "0rem"];
    const driftXMap = [-16, -8, 0, 8, 16];
    const driftYMap = [-14, -7, 0, 7, 14];
    const menuItems = Array.from(document.querySelectorAll(".menu-item"));
    const screen = document.getElementById("screen");
    const bars = document.getElementById("bars");
    const statusCode = document.getElementById("status-code");
    const statusTitle = document.getElementById("status-title");
    const statusCopy = document.getElementById("status-copy");

    let selectedIndex = 0;
    const activeTimers = new Map();

    function normalizeIndex(index) {
      const count = menuItems.length;
      return (index % count + count) % count;
    }

    function buildBars() {
      for (let index = 0; index < 40; index += 1) {
        const bar = document.createElement("span");
        const baseHeight = 22 + Math.round((Math.sin(index * 0.81) + 1) * 15 + (index % 5) * 3);
        const duration = 1.16 + (index % 7) * 0.1;
        const delay = (index % 9) * 0.08;

        bar.className = "bar";
        bar.style.setProperty("--base-height", `${baseHeight}px`);
        bar.style.setProperty("--dur", `${duration}s`);
        bar.style.setProperty("--delay", `${delay}s`);
        bars.appendChild(bar);
      }
    }

    function applyDrift() {
      const driftX = driftXMap[selectedIndex];
      const driftY = driftYMap[selectedIndex];

      screen.style.setProperty("--disc-drift-x", `${driftX * 0.36}px`);
      screen.style.setProperty("--disc-drift-y", `${driftY * 0.48}px`);
      screen.style.setProperty("--ui-drift-x", `${driftX * 0.7}px`);
      screen.style.setProperty("--ui-drift-y", `${driftY * 0.68}px`);
      screen.style.setProperty("--logo-drift-x", `${driftX * -0.08}px`);
      screen.style.setProperty("--logo-drift-y", `${driftY * -0.12}px`);
    }

    function render() {
      menuItems.forEach((item, index) => {
        item.classList.toggle("is-selected", index === selectedIndex);
        item.style.setProperty("--indent", indentMap[index]);
        item.setAttribute("aria-current", index === selectedIndex ? "true" : "false");
      });

      const entry = entries[selectedIndex];
      statusCode.textContent = entry.code;
      statusTitle.textContent = entry.title;
      statusCopy.textContent = entry.copy;
      applyDrift();
    }

    function moveSelection(delta) {
      selectedIndex = normalizeIndex(selectedIndex + delta);
      render();
    }

    function startHeldScroll(key, delta) {
      if (activeTimers.has(key)) {
        return;
      }

      moveSelection(delta);

      const repeatTimeout = window.setTimeout(() => {
        const repeatInterval = window.setInterval(() => {
          moveSelection(delta);
        }, 105);

        activeTimers.set(key, { repeatInterval });
      }, 210);

      activeTimers.set(key, { repeatTimeout });
    }

    function stopHeldScroll(key) {
      const timers = activeTimers.get(key);
      if (!timers) {
        return;
      }

      if (timers.repeatTimeout) {
        window.clearTimeout(timers.repeatTimeout);
      }

      if (timers.repeatInterval) {
        window.clearInterval(timers.repeatInterval);
      }

      activeTimers.delete(key);
    }

    menuItems.forEach((item, index) => {
      item.addEventListener("mouseenter", () => {
        selectedIndex = index;
        render();
      });

      item.addEventListener("focus", () => {
        selectedIndex = index;
        render();
      });
    });

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
      }

      if (event.repeat) {
        return;
      }

      if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
        startHeldScroll(event.key, -1);
      } else if (event.key === "ArrowDown" || event.key === "ArrowRight") {
        startHeldScroll(event.key, 1);
      }
    });

    window.addEventListener("keyup", (event) => {
      stopHeldScroll(event.key);
    });

    window.addEventListener("blur", () => {
      for (const key of activeTimers.keys()) {
        stopHeldScroll(key);
      }
    });

    buildBars();
    render();
  </script>
</body>
</html>
