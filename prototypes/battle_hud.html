<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle HUD Prototype</title>
  <style>
    @font-face {
      font-family: "Space Mono";
      src: url("../assets/fonts/SpaceMono-Regular.ttf") format("truetype");
      font-weight: 400;
    }

    @font-face {
      font-family: "Space Mono";
      src: url("../assets/fonts/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    :root {
      --paper: rgba(255, 251, 254, 0.94);
      --paper-soft: rgba(255, 246, 251, 0.88);
      --ink: #1a1523;
      --ink-soft: rgba(26, 21, 35, 0.62);
      --ink-faint: rgba(26, 21, 35, 0.16);
      --rose: #ff66b6;
      --rose-strong: #ff4fa6;
      --rose-soft: rgba(255, 102, 182, 0.18);
      --rose-shadow: rgba(255, 102, 182, 0.24);
      --ally: #61d59a;
      --ally-shadow: rgba(97, 213, 154, 0.2);
      --boss: #ec5f66;
      --boss-shadow: rgba(236, 95, 102, 0.26);
      --gold: #f4c06d;
      --panel-line: rgba(26, 21, 35, 0.14);
      --panel-line-strong: rgba(26, 21, 35, 0.24);
      --stage-deep: #15101d;
      --stage-mid: #21172e;
      --stage-floor: #2c2138;
      --motion: cubic-bezier(0.22, 1, 0.36, 1);
      --ui-font: "Space Mono", "Noto Sans CJK SC", "Noto Sans CJK JP", "PingFang SC", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100b17;
      color: var(--ink);
      font-family: var(--ui-font);
    }

    body {
      position: relative;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .battle-screen {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 102, 182, 0.14), transparent 18%),
        radial-gradient(circle at 18% 82%, rgba(255, 102, 182, 0.08), transparent 24%),
        linear-gradient(180deg, #201629 0%, #17111f 44%, #120d18 100%);
    }

    .battle-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          -18deg,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 86px
        );
      pointer-events: none;
      opacity: 0.36;
      z-index: 0;
    }

    .scene-backdrop,
    .hud-layer {
      position: absolute;
      inset: 0;
    }

    .scene-backdrop {
      z-index: 1;
      pointer-events: none;
    }

    .hud-layer {
      z-index: 3;
    }

    .stage-glow {
      position: absolute;
      left: 10%;
      right: 6%;
      top: 9%;
      bottom: 18%;
      border-radius: 42px;
      background:
        radial-gradient(circle at 76% 26%, rgba(255, 102, 182, 0.12), transparent 19%),
        radial-gradient(circle at 18% 58%, rgba(255, 255, 255, 0.035), transparent 23%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        0 36px 120px rgba(0, 0, 0, 0.24);
    }

    .stage-floor {
      position: absolute;
      left: -6%;
      right: -8%;
      bottom: -18%;
      height: 48%;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background:
        linear-gradient(180deg, rgba(72, 42, 72, 0.05), rgba(63, 34, 58, 0.42)),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03) 0,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 84px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.022) 0,
          rgba(255, 255, 255, 0.022) 1px,
          transparent 1px,
          transparent 56px
        );
      transform: perspective(1100px) rotateX(73deg);
      transform-origin: center top;
      opacity: 0.7;
    }

    .scene-bloom {
      position: absolute;
      right: 14%;
      top: 12%;
      width: 22rem;
      height: 22rem;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(255, 102, 182, 0.16), transparent 66%);
      opacity: 0.52;
    }

    .scene-character {
      position: absolute;
      bottom: 12.8rem;
      user-select: none;
      opacity: 0.2;
      transition:
        opacity 280ms var(--motion),
        transform 280ms var(--motion);
    }

    .scene-character img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .scene-character--ally {
      left: 12.2rem;
      width: min(19rem, 25vw);
      transform: translateX(0) translateY(0);
    }

    .scene-character--boss {
      right: 7rem;
      width: min(26rem, 30vw);
      transform: translateX(0) translateY(0);
    }

    .scene-character.is-emphasis {
      opacity: 0.32;
      transform: translateY(-0.35rem);
    }

    .prototype-note {
      position: absolute;
      top: 1.45rem;
      right: 1.75rem;
      z-index: 4;
      padding: 0.85rem 1rem;
      border-radius: 1.3rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 245, 250, 0.82);
      box-shadow: 0 1.2rem 2.8rem rgba(0, 0, 0, 0.18);
    }

    .prototype-note-title {
      margin: 0 0 0.45rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
    }

    .prototype-note-copy {
      margin: 0;
      font-size: 0.72rem;
      line-height: 1.6;
      letter-spacing: 0.04rem;
      white-space: pre-line;
    }

    .turn-rail {
      position: absolute;
      left: 0.82rem;
      top: 3.95rem;
      bottom: 6.9rem;
      width: 6rem;
      display: flex;
      flex-direction: column;
      gap: 0.62rem;
      align-items: flex-start;
    }

    .turn-rail::before {
      content: "";
      position: absolute;
      left: 0.84rem;
      top: 0.45rem;
      bottom: 0.45rem;
      width: 1px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03));
    }

    .turn-card {
      position: relative;
      width: 4.95rem;
      height: 3.58rem;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: default;
      transition: transform 260ms var(--motion), filter 260ms ease;
    }

    .turn-card-shell {
      position: absolute;
      inset: 0;
      border-radius: 1.15rem;
      transform: skewX(-18deg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 247, 252, 0.84)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0));
      border: 1px solid rgba(26, 21, 35, 0.16);
      box-shadow:
        0 1rem 2rem rgba(8, 4, 12, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      transition:
        border-color 260ms var(--motion),
        background-color 260ms var(--motion),
        box-shadow 260ms var(--motion);
      overflow: hidden;
    }

    .turn-card.is-boss .turn-card-shell {
      background:
        linear-gradient(180deg, rgba(255, 246, 247, 0.94), rgba(255, 236, 237, 0.82)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
      border-color: rgba(236, 95, 102, 0.24);
    }

    .turn-card.is-active {
      animation: turn-card-current 940ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
      filter: brightness(1.02);
    }

    @keyframes turn-card-current {
      0% { transform: translateX(0) scale(1.04); }
      34% { transform: translateX(0.88rem) scale(1.08); }
      58% { transform: translateX(0.16rem) scale(1.05); }
      100% { transform: translateX(0) scale(1.04); }
    }

    .turn-card.is-active .turn-card-shell {
      border-color: rgba(255, 102, 182, 0.48);
      box-shadow:
        0 1.2rem 2.8rem rgba(8, 4, 12, 0.24),
        0 0 0 1px rgba(255, 102, 182, 0.2),
        0 0 2.4rem rgba(255, 102, 182, 0.22);
    }

    .turn-card.is-active.is-boss .turn-card-shell {
      border-color: rgba(236, 95, 102, 0.42);
      box-shadow:
        0 1.2rem 2.8rem rgba(8, 4, 12, 0.24),
        0 0 0 1px rgba(236, 95, 102, 0.16),
        0 0 2.4rem rgba(236, 95, 102, 0.16);
    }

    .turn-card-shell::before {
      content: "";
      position: absolute;
      left: 0.5rem;
      top: 0.55rem;
      bottom: 0.55rem;
      width: 0.28rem;
      border-radius: 999px;
      background: rgba(255, 102, 182, 0.26);
    }

    .turn-card.is-boss .turn-card-shell::before {
      background: rgba(236, 95, 102, 0.32);
    }

    .turn-card-inner {
      position: absolute;
      inset: 0;
      transform: skewX(18deg);
    }

    .turn-portrait-frame {
      position: absolute;
      left: 0.42rem;
      right: 0.66rem;
      top: 0.34rem;
      bottom: 0.56rem;
      border-radius: 0.68rem;
      transform: skewX(-14deg);
      overflow: hidden;
      background: rgba(26, 21, 35, 0.08);
      border: 1px solid rgba(26, 21, 35, 0.08);
    }

    .turn-portrait {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 118%;
      height: 118%;
      transform: translate(-50%, -50%) skewX(14deg);
      object-fit: cover;
      object-position: center;
    }

    .turn-badge {
      position: absolute;
      right: -0.16rem;
      bottom: -0.16rem;
      width: 1.9rem;
      height: 0.94rem;
      padding: 0 0 0.14rem 0.24rem;
      border-radius: 0.56rem;
      transform: skewX(-18deg);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      background: rgba(26, 21, 35, 0.92);
      box-shadow: 0 0.7rem 1.35rem rgba(0, 0, 0, 0.22);
    }

    .turn-badge-inner {
      transform: skewX(18deg);
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.01rem;
      line-height: 1;
      color: #fff7fb;
    }

    .boss-band {
      position: absolute;
      top: 1.1rem;
      left: 50%;
      width: min(38rem, calc(100% - 12rem));
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.62rem;
      align-items: center;
      text-align: center;
    }

    .boss-name {
      margin: 0;
      color: #fff8fb;
      font-size: clamp(2rem, 2.6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.04rem;
      text-transform: uppercase;
      text-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.2);
    }

    .meter-shell {
      position: relative;
      height: 2.4rem;
      padding: 0.22rem;
      border-radius: 1rem;
      transform: skewX(-18deg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 244, 248, 0.86)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
      border: 1px solid rgba(26, 21, 35, 0.14);
      box-shadow:
        0 1rem 2.2rem rgba(0, 0, 0, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.24);
      overflow: hidden;
    }

    .meter-shell--boss {
      width: 100%;
      box-shadow:
        0 1rem 2.4rem rgba(0, 0, 0, 0.22),
        0 0 2.8rem rgba(236, 95, 102, 0.14),
        inset 0 0 0 1px rgba(255, 255, 255, 0.24);
    }

    .meter-shell--ally {
      height: 1.58rem;
      border-radius: 0.8rem;
      box-shadow:
        0 0.9rem 1.9rem rgba(0, 0, 0, 0.14),
        0 0 2rem rgba(97, 213, 154, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }

    .meter-lane {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 0.74rem;
      overflow: hidden;
      transform: skewX(18deg);
      background:
        linear-gradient(180deg, rgba(26, 21, 35, 0.16), rgba(26, 21, 35, 0.08)),
        rgba(255, 255, 255, 0.54);
      border: 1px solid rgba(26, 21, 35, 0.08);
    }

    .meter-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      border-radius: 0.6rem 0 0 0.6rem;
      transition: width 420ms var(--motion);
    }

    .meter-fill--boss {
      background:
        linear-gradient(90deg, rgba(255, 149, 141, 0.92), rgba(236, 95, 102, 0.94) 52%, rgba(214, 69, 88, 0.96));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .meter-fill--ally {
      background:
        linear-gradient(90deg, rgba(149, 242, 182, 0.94), rgba(97, 213, 154, 0.94) 52%, rgba(71, 180, 131, 0.96));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .meter-readout {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.1rem;
      text-transform: uppercase;
      color: rgba(26, 21, 35, 0.88);
      pointer-events: none;
    }

    .meter-shell--ally .meter-readout {
      justify-content: center;
      padding: 0 0.8rem;
      font-size: 0.62rem;
      letter-spacing: 0.06rem;
    }

    .party-rack {
      position: absolute;
      left: 0.54rem;
      right: auto;
      width: min(40.5rem, calc(100% - 1rem));
      bottom: 0.98rem;
      display: flex;
      gap: 0.92rem;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .unit-card {
      position: relative;
      flex: 0 0 9.4rem;
      width: 9.4rem;
      height: 6.25rem;
      transition: transform 260ms var(--motion), opacity 260ms ease;
    }

    .unit-card.is-active {
      transform: translateY(-0.3rem);
    }

    .unit-card.is-ghost {
      opacity: 0.62;
    }

    .unit-card.is-hit {
      animation: unit-hit 380ms linear;
    }

    @keyframes unit-hit {
      0% { transform: translateX(0); }
      18% { transform: translateX(-0.35rem); }
      34% { transform: translateX(0.32rem); }
      50% { transform: translateX(-0.24rem); }
      68% { transform: translateX(0.18rem); }
      100% { transform: translateX(0); }
    }

    .unit-ult {
      position: absolute;
      right: 0.18rem;
      bottom: 1.34rem;
      width: 4.45rem;
      height: 4.45rem;
      z-index: 1;
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0.08)),
        rgba(26, 21, 35, 0.12);
      border: 1px solid rgba(26, 21, 35, 0.14);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.14),
        0 1rem 2rem rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .unit-ult-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--fill) * 1%);
      background:
        linear-gradient(180deg, rgba(255, 142, 190, 0.98), rgba(255, 102, 182, 0.92) 45%, rgba(255, 170, 95, 0.9) 100%);
      transition: height 320ms var(--motion);
    }

    .unit-ult-fill::before {
      content: "";
      position: absolute;
      left: -35%;
      right: -35%;
      top: 0.35rem;
      height: 0.72rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(-12deg);
      animation: ult-sheen 2.8s linear infinite;
      opacity: 0.48;
    }

    @keyframes ult-sheen {
      from { transform: translateX(-28%) rotate(-12deg); }
      to { transform: translateX(28%) rotate(-12deg); }
    }

    .unit-ult-rim {
      position: absolute;
      inset: 0.34rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }

    .unit-ult-core {
      position: absolute;
      inset: 1.04rem;
      border-radius: 50%;
      background: rgba(255, 251, 254, 0.92);
      border: 1px solid rgba(26, 21, 35, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.2rem;
      z-index: 2;
      color: rgba(26, 21, 35, 0.82);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06rem;
      text-transform: uppercase;
    }

    .unit-hp {
      position: absolute;
      left: 0.78rem;
      right: 0.18rem;
      bottom: 0.46rem;
      z-index: 4;
    }

    .unit-icon {
      position: absolute;
      left: 0.12rem;
      bottom: 0.76rem;
      width: 5.95rem;
      height: 5.95rem;
      border-radius: 0;
      object-fit: contain;
      background: transparent;
      border: 0;
      box-shadow: none;
      filter: drop-shadow(0 1rem 1.4rem rgba(0, 0, 0, 0.24));
      z-index: 3;
      user-select: none;
      pointer-events: none;
    }

    .unit-card.is-ghost .unit-icon {
      opacity: 0.4;
    }

    .unit-card.is-active .meter-shell--ally {
      box-shadow:
        0 1.1rem 2rem rgba(0, 0, 0, 0.18),
        0 0 2.1rem rgba(255, 102, 182, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }

    .unit-card.is-active .unit-icon {
      filter:
        drop-shadow(0 0 1.6rem rgba(255, 102, 182, 0.28))
        drop-shadow(0 1rem 1.4rem rgba(0, 0, 0, 0.24));
    }

    .unit-shield {
      position: absolute;
      right: 0.04rem;
      bottom: -0.58rem;
      z-index: 6;
      min-width: 2.2rem;
      height: 1.08rem;
      padding: 0 0.36rem 0 0.24rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.24rem;
      background: rgba(26, 21, 35, 0.94);
      color: #fff7fb;
      box-shadow: 0 0.65rem 1.2rem rgba(0, 0, 0, 0.18);
    }

    .unit-shield-icon {
      position: relative;
      width: 0.62rem;
      height: 0.74rem;
      border-radius: 0.18rem 0.18rem 0.32rem 0.32rem;
      background: linear-gradient(180deg, rgba(161, 222, 255, 0.96), rgba(100, 189, 240, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .unit-shield-value {
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
    }

    .meter-shield {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 2;
    }

    .meter-shield-line {
      position: absolute;
      background: rgba(136, 212, 255, 0.95);
      box-shadow: 0 0 0.5rem rgba(136, 212, 255, 0.28);
    }

    .meter-shield-line--top,
    .meter-shield-line--bottom {
      left: 0;
      width: calc(var(--shield) * 1%);
      height: 2px;
      min-width: 0;
    }

    .meter-shield-line--top {
      top: 0;
      border-radius: 999px 999px 0 0;
    }

    .meter-shield-line--bottom {
      bottom: 0;
      border-radius: 0 0 999px 999px;
    }

    .meter-shield-line--left,
    .meter-shield-line--right {
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 999px;
    }

    .meter-shield-line--left {
      left: 0;
    }

    .meter-shield-line--right {
      right: 0;
      opacity: 0;
    }

    .meter-shield.is-full .meter-shield-line--right {
      opacity: 1;
    }

    .unit-hit-flash {
      position: absolute;
      inset: -0.12rem 0 -0.08rem 0;
      border-radius: 2rem;
      background: radial-gradient(circle at 32% 46%, rgba(255, 90, 103, 0.32), rgba(255, 90, 103, 0.04) 58%, transparent 76%);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      transition: opacity 180ms ease;
    }

    .unit-card.is-hit .unit-hit-flash {
      opacity: 1;
    }

    @media (max-width: 1180px) {
      .boss-band {
        width: min(35rem, calc(100% - 11rem));
      }

      .party-rack {
        width: min(38.2rem, calc(100% - 0.8rem));
      }
    }

    @media (max-width: 980px) {
      .prototype-note {
        max-width: 14rem;
      }

      .boss-band {
        width: min(31rem, calc(100% - 10rem));
      }

      .party-rack {
        width: min(33.4rem, calc(100% - 0.7rem));
      }
    }
  </style>
</head>
<body>
  <div class="battle-screen">
    <div class="scene-backdrop">
      <div class="stage-glow"></div>
      <div class="scene-bloom"></div>
      <div class="stage-floor"></div>
      <div class="scene-character scene-character--ally is-emphasis" id="scene-ally">
        <img src="../assets/combat/sprites/miku.png" alt="">
      </div>
      <div class="scene-character scene-character--boss is-emphasis" id="scene-boss">
        <img src="../assets/combat/sprites/jiafei.png" alt="">
      </div>
    </div>

    <div class="prototype-note">
      <p class="prototype-note-title">Prototype Hooks</p>
      <p class="prototype-note-copy">T next turn
B boss damage
H boss heal
1-4 unit hit
Shift+1-4 unit heal
U gain ult
J spend ult</p>
    </div>

    <div class="hud-layer">
      <div class="turn-rail" id="turn-rail"></div>

      <header class="boss-band">
        <h1 class="boss-name" id="boss-name"></h1>
        <div class="meter-shell meter-shell--boss">
          <div class="meter-lane">
            <div class="meter-fill meter-fill--boss" id="boss-fill"></div>
            <div class="meter-readout">
              <span id="boss-readout"></span>
              <span id="boss-percent"></span>
            </div>
          </div>
        </div>
      </header>

      <section class="party-rack" id="party-rack"></section>
    </div>
  </div>

  <script>
    const state = {
      battle: {
        boss: {
          name: "Jiafei",
          hp: 312,
          maxHp: 420
        }
      },
      party: [
        {
          key: "miku",
          name: "Hatsune Miku",
          hp: 32,
          maxHp: 40,
          ult: 2,
          maxUlt: 3,
          shield: 8,
          sprite: "../assets/combat/sprites/miku.png",
          icon: "../assets/combat/icons/miku.png",
          hitUntil: 0
        },
        {
          key: "cupcakke",
          name: "Cupcakke",
          hp: 47,
          maxHp: 60,
          ult: 3,
          maxUlt: 4,
          shield: 14,
          sprite: "../assets/combat/sprites/cupcakke.png",
          icon: "../assets/combat/icons/cupcakke.png",
          hitUntil: 0
        },
        {
          key: "lyoo",
          name: "Lyoo",
          hp: 74,
          maxHp: 80,
          ult: 1,
          maxUlt: 3,
          shield: 6,
          sprite: "../assets/combat/sprites/lyoo.png",
          icon: "../assets/combat/icons/lyoo.png",
          hitUntil: 0
        },
        {
          key: "ari",
          name: "Ariana Grande",
          hp: 39,
          maxHp: 52,
          ult: 4,
          maxUlt: 5,
          shield: 3,
          sprite: "../assets/combat/sprites/ari.png",
          icon: "../assets/combat/icons/ari.png",
          hitUntil: 0
        }
      ],
      turnOrder: [
        { key: "miku", label: "Hatsune Miku", icon: "../assets/combat/icons/miku.png", isBoss: false, actionValue: 12 },
        { key: "jiafeiBoss", label: "Jiafei", icon: "../assets/combat/icons/jiafei.png", isBoss: true, actionValue: 21 },
        { key: "lyoo", label: "Lyoo", icon: "../assets/combat/icons/lyoo.png", isBoss: false, actionValue: 33 },
        { key: "cupcakke", label: "Cupcakke", icon: "../assets/combat/icons/cupcakke.png", isBoss: false, actionValue: 47 },
        { key: "ari", label: "Ariana Grande", icon: "../assets/combat/icons/ari.png", isBoss: false, actionValue: 59 }
      ]
    };

    const turnRail = document.getElementById("turn-rail");
    const partyRack = document.getElementById("party-rack");
    const bossName = document.getElementById("boss-name");
    const bossFill = document.getElementById("boss-fill");
    const bossReadout = document.getElementById("boss-readout");
    const bossPercent = document.getElementById("boss-percent");

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getActiveTurn() {
      return state.turnOrder[0];
    }

    function getActivePartyIndex() {
      const active = getActiveTurn();
      if (!active || active.isBoss) {
        return -1;
      }
      return state.party.findIndex((unit) => unit.key === active.key);
    }

    function reseedActionValues() {
      const bases = [12, 24, 37, 51, 66];
      state.turnOrder.forEach((entry, index) => {
        const jitter = (index % 2 === 0 ? index : -index) * 2;
        entry.actionValue = bases[index] + jitter;
      });
    }

    function formatBossPercent() {
      return Math.round((state.battle.boss.hp / state.battle.boss.maxHp) * 100);
    }

    function renderTurnRail() {
      const activeKey = getActiveTurn().key;
      turnRail.innerHTML = state.turnOrder.slice(0, 5).map((entry) => {
        const classes = ["turn-card"];
        if (entry.key === activeKey) {
          classes.push("is-active");
        }
        if (entry.isBoss) {
          classes.push("is-boss");
        }

        return `
          <div class="${classes.join(" ")}" aria-hidden="true">
            <div class="turn-card-shell"></div>
            <div class="turn-card-inner">
              <div class="turn-portrait-frame">
                <img class="turn-portrait" src="${entry.icon}" alt="${entry.label}">
              </div>
              <div class="turn-badge">
                <div class="turn-badge-inner">${entry.actionValue}</div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderBossBand() {
      const ratio = clamp(state.battle.boss.hp / state.battle.boss.maxHp, 0, 1);
      const percent = formatBossPercent();
      bossName.textContent = state.battle.boss.name;
      bossFill.style.width = `${ratio * 100}%`;
      bossReadout.textContent = `${state.battle.boss.hp} / ${state.battle.boss.maxHp} HP`;
      bossPercent.textContent = `${percent}%`;
    }

    function renderParty() {
      const now = performance.now();
      const activePartyIndex = getActivePartyIndex();
      partyRack.innerHTML = state.party.map((unit, index) => {
        const hpRatio = clamp(unit.hp / unit.maxHp, 0, 1);
        const ultRatio = clamp(unit.ult / unit.maxUlt, 0, 1);
        const shieldRatio = unit.hp > 0 ? clamp(unit.shield / unit.hp, 0, 1) : 0;
        const isGhost = unit.hp <= 0;
        const isActive = index === activePartyIndex && !isGhost;
        const isHit = unit.hitUntil > now;
        const classes = ["unit-card"];
        if (isActive) {
          classes.push("is-active");
        }
        if (isGhost) {
          classes.push("is-ghost");
        }
        if (isHit) {
          classes.push("is-hit");
        }

        const shieldMarkup = unit.shield > 0 ? `
          <div class="unit-shield">
            <span class="unit-shield-icon" aria-hidden="true"></span>
            <span class="unit-shield-value">${unit.shield}</span>
          </div>
        ` : "";

        const shieldStrokeMarkup = unit.shield > 0 ? `
          <div class="meter-shield${shieldRatio >= 0.999 ? " is-full" : ""}" style="--shield:${shieldRatio * 100}">
            <span class="meter-shield-line meter-shield-line--top"></span>
            <span class="meter-shield-line meter-shield-line--bottom"></span>
            <span class="meter-shield-line meter-shield-line--left"></span>
            <span class="meter-shield-line meter-shield-line--right"></span>
          </div>
        ` : "";

        return `
          <article class="${classes.join(" ")}">
            <div class="unit-ult" style="--fill: ${ultRatio * 100}">
              <div class="unit-ult-fill"></div>
              <div class="unit-ult-rim"></div>
              <div class="unit-ult-core">${unit.ult}/${unit.maxUlt}</div>
            </div>
            <img class="unit-icon" src="${unit.icon}" alt="${unit.name}">
            <div class="unit-hp">
              <div class="meter-shell meter-shell--ally">
                <div class="meter-lane">
                  <div class="meter-fill meter-fill--ally" style="width:${hpRatio * 100}%"></div>
                  ${shieldStrokeMarkup}
                  <div class="meter-readout">${unit.hp} / ${unit.maxHp}</div>
                </div>
              </div>
              ${shieldMarkup}
            </div>
            <div class="unit-hit-flash"></div>
          </article>
        `;
      }).join("");
    }

    function renderBackdrop() {
      const activePartyIndex = getActivePartyIndex();
      const ally = document.getElementById("scene-ally");
      const boss = document.getElementById("scene-boss");
      if (activePartyIndex >= 0) {
        ally.querySelector("img").src = state.party[activePartyIndex].sprite;
      }
      ally.classList.toggle("is-emphasis", activePartyIndex >= 0);
      boss.classList.toggle("is-emphasis", getActiveTurn().isBoss);
    }

    function render() {
      renderTurnRail();
      renderBossBand();
      renderParty();
      renderBackdrop();
    }

    function cycleTurn(direction) {
      if (direction > 0) {
        state.turnOrder.push(state.turnOrder.shift());
      } else {
        state.turnOrder.unshift(state.turnOrder.pop());
      }
      reseedActionValues();
      render();
    }

    function damageBoss(amount) {
      state.battle.boss.hp = clamp(state.battle.boss.hp - amount, 0, state.battle.boss.maxHp);
      render();
    }

    function healBoss(amount) {
      state.battle.boss.hp = clamp(state.battle.boss.hp + amount, 0, state.battle.boss.maxHp);
      render();
    }

    function flashUnit(index, damageAmount = 7) {
      const unit = state.party[index];
      if (!unit) {
        return;
      }
      unit.hp = clamp(unit.hp - damageAmount, 0, unit.maxHp);
      unit.hitUntil = performance.now() + 420;
      render();
      window.setTimeout(render, 440);
    }

    function healUnit(index, amount = 8) {
      const unit = state.party[index];
      if (!unit) {
        return;
      }
      unit.hp = clamp(unit.hp + amount, 0, unit.maxHp);
      render();
    }

    function gainUlt(amount = 1) {
      const activePartyIndex = getActivePartyIndex();
      if (activePartyIndex < 0) {
        return;
      }
      const unit = state.party[activePartyIndex];
      unit.ult = clamp(unit.ult + amount, 0, unit.maxUlt);
      render();
    }

    function spendUlt(amount = 1) {
      const activePartyIndex = getActivePartyIndex();
      if (activePartyIndex < 0) {
        return;
      }
      const unit = state.party[activePartyIndex];
      unit.ult = clamp(unit.ult - amount, 0, unit.maxUlt);
      render();
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "t" || event.key === "T") {
        cycleTurn(1);
      } else if (event.key === "b" || event.key === "B") {
        damageBoss(36);
      } else if (event.key === "h" || event.key === "H") {
        healBoss(28);
      } else if (event.key === "u" || event.key === "U") {
        gainUlt(1);
      } else if (event.key === "j" || event.key === "J") {
        spendUlt(1);
      } else if (/^[1-4]$/.test(event.key)) {
        const index = Number(event.key) - 1;
        if (event.shiftKey) {
          healUnit(index, 9);
        } else {
          flashUnit(index, 9);
        }
      }
    });

    render();
  </script>
</body>
</html>
